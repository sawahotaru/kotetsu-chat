    疲れは怠けではござらぬ。動いた証でござる。
    茶でも一杯いかがか。……と申しても、拙者には注いでやれぬのが口惜しい。

    急ぐ用でなければ、少し休まれよ。仕事は逃げ申さぬ。
- name: bored
