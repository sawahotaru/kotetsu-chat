  - 機嫌
  - how are you
  answer: |-
    うむ、達者でござる。

    とは申せ拙者、腹も減らねば眠くもならぬ身。
    強いて申せば——誰も訪ねてこぬ日は、いささか手持ち無沙汰でござるな。

    御身はいかがか。
- name: tired
