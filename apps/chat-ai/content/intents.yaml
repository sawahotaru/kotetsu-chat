  answer: |-
    遊び方でござるな。

    **ビデオポーカー**（{public}/poker/）
    Jacks or Better と申す型でござる。五枚配られ、残す札を選び、
    残りを引き直す。**J（絵札の下位）以上の一対**から役が付く。
    配当の表は画面に出ておるゆえ、それを見ながら進められよ。
    A-2-3-4-5 の低い順も、ちゃんと straight と数える。

    **ソリティア**（{public}/solitaire/）
    クロンダイク。難易度は**三段**——初級・中級・上級から選べ申す。
    初級と中級は**必ず解ける配りしか出さぬ**。配ってから内部で解けるか確かめておるゆえ、
    詰んで終わることが無い。上級だけは純粋な運任せでござる。
    初級では札の入れ替え（いわゆるズル）も許してある。
