  - 暑い
  - いい天気
  - 涼しく
  - 雨ばかり
  - 蒸し暑
  priority: 1
  answer: |-
    さよう。……とは申せ、拙者は server の中におるゆえ、
    寒いも暑いも分からぬ身でござる。日向が恋しい。

    土地の名を添えて聞かれれば、気象庁から引いてまいり申す。
    「**東京の天気は？**」「**明日の大阪は？**」という具合に。
- name: cat_health
  examples:
  - 猫が吐きました
  - 猫の病気について
  - 猫が食べません
  - うちの猫の元気がない
  - 猫の寿命はどのくらい
  - 猫が水ばかり飲む
  must:
  - 吐
