- name: lab_cost
  examples:
  - 無料ですか
  - 料金は
  - お金かかる
  - いくらかかる
  - 課金
  - 有料なの
  - 費用は
  answer: |-
    すべて無料で動いておる。

    外の AI サービスを呼んでおらぬゆえ、拙者と話しても料金は発生せぬ。
    サーバーも無料枠のもの。〔LLM〕。

    LLM を使う折も、重みは無料で手に入るものを**このサーバーの CPU で**動かす。
    代わりに払うのは金ではなく**計算力**でござる。考えておる間は
    同じサーバーの EC や予約システムが少し遅くなるゆえ、一度に一人ずつしか相手できぬ。
