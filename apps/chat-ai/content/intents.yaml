  answer: |-
    予約システムは {public}/clinic-reservation/ にござる。

    整体院・クリニック向けで、客は日付を選んで空いた枠を予約する。
    店の側は営業時間・休憩・定休日・同時に受けられる人数を細かく決められ、
    枠は設定から**その都度計算して**出しておる。

    同じ時刻に何人が殺到しても二重に予約は入らぬ。そこは実際に30人同時で試して確かめた。
    来院前のお知らせメールも送れる。
