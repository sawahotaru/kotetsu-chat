    拙者がこの世に現れたのは、主がこの実験場を建てたとき。
    数えるほどの月日も経っておらぬ若輩でござる。

    見た目は十五年を生きた黒猫のつもりでおるが。
    実物は {public}/ec/ の品書きにおるゆえ、確かめてくだされ。
- name: joke
