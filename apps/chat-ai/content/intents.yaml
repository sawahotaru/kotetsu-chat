  - 問い合わせ
  - コンタクト
  - メールアドレス
  - 窓口
  - 相談したい
  priority: 2
  answer: |-
    主への繋ぎは **GitHub** でござる。

    {source} のいずれかの repo の **Issues** に一筆書き置かれよ。
    主が気づいて返し申す。

    その前に {public}/clinic-reservation/ を**客として一度使うてみる**のが早道でござる。
    どんな画面を客が見るのか、その場で分かり申す。
    ⚠ かの予約フォームは見本でござる。相談事をそこへ書き込むのはご遠慮くだされ。

    「なぜ文（メール）の宛先を書かぬのか」と思われたか。
    宛先を表に晒せば、人ならぬ機械の使いが山と押し寄せるゆえでござる。
    GitHub ならば、名乗った者だけが門を叩ける。
- name: tour
  examples:
  - 何から見ればいい
  - おすすめを教えて
  - 初めて来ました
  - 見どころは
  - どこから見るのがいい
  - 案内してください
  must:
  - 何から
  - おすすめ
  - 初めて
  - 見どころ
  - どこから
  - 案内し
  priority: 1
  answer: |-
    初めてでござるか。ならば案内仕る。

    **まずはこれ**
    1. **EC サイト** … {public}/ec/ 　品を選び、籠に入れ、注文まで通してみられよ
    2. **予約システム** … {public}/clinic-reservation/ 　日を選ぶと空き枠が出る

    **息抜きに**
    3. **ソリティア** … {public}/solitaire/ 　初級・中級は必ず解ける配りしか出ぬ
    4. **ポーカー** … {public}/poker/

    **小物**
    5. **Go / Python の実験場** … {public}/go/ と {public}/py/

    一つだけ選べと申されるなら、**EC の注文を最後まで通してみる**のが良い。
    税も送料も本物同様に数えておるゆえ、作りの細かさが分かり申す。
- name: infra
  examples:
  - サーバーは何を使ってる
  - どこで動いてるの
  - ホスティングは
  - インフラの構成
  - クラウドはどこ
  - VPSですか
  must:
  - サーバ
  - どこで動
  - ホスティング
  - インフラ
  - クラウド
  - vps
  answer: |-
    この実験場は、**借り物の server 一台**の上に丸ごと乗っており申す。

    門番が Caddy。その後ろに EC、予約、遊び、拙者が並んで住んでおる。
    一台ゆえ、拙者が長考しておると隣の EC が少し遅くなる。仲良く暮らす他ないのでござる。

    server は無料の枠で借りたもの。詳しい造りまでは申せぬ——
    **内訳を細かに明かすのは、盗人に間取りを教えるようなもの**ゆえ、
    そこは武士の情けで勘弁してくだされ。

    土台の様子だけなら {public}/go/ と {public}/py/ で覗け申す。
- name: reliability
  examples:
  - 止まったりしませんか
  - 落ちることはある
  - 障害は起きないの
  - バックアップは取ってる
  - データが消えたらどうなる
  must:
  - 止ま
  - 落ちる
  - 障害
  - バックアップ
  - 控え
  - 消え
  - 停止
  answer: |-
    正直に申す。**止まらぬとは約束できぬ。**

    一台の無料の server ゆえ、貸し主の都合で落ちることもあり得る。
    これは見本の場であって、御身の商いを預かる場ではござらぬ。

    なれど、**手を抜いてはおらぬ**:
    - 中身の控えは毎日取っておる
    - 控えは別の場所へも移してある
    - しかも「戻せるかどうか」を実際に試して確かめた。取るだけ取って戻せぬ控えは、無いのと同じでござる

    御身の商いに据えるとなれば、そこは別の話。止まらぬ備えごと相談に乗り申す。
- name: slow
  examples:
  - 反応が遅い
  - 動作が重い
  - 時間がかかりすぎ
  - もっさりしてる
  must:
  - 遅い
  - 重い
  - 時間がかか
  - もっさり
  - 遅く
  answer: |-
    遅うござったか。相すまぬ。

    心当たりは二つ:

    **一つ、拙者が考えておるとき**
    拙者の頭は、この server の cpu で動いており申す。絵を描く道具（GPU）は無い。
    ゆえに一度に一人ずつしか相手できぬ。順番待ちが出ることもござる。

    **二つ、皆で一台に住んでおるゆえ**
    EC も予約も遊びも、同じ server の上に並んでおる。誰かが重い用を申しつければ、
    隣まで少し遅うなる。

    なお、**拙者が心得ておる問いは瞬時に返る**。
    考えずに済むものは考えぬ——それがこの造りの要でござる。
- name: bug_report
  examples:
  - バグを見つけました
  - 不具合があります
  - エラーが出ます
  - 動きません
  - 表示がおかしい
  - 壊れてる
  must:
  - バグ
  - 不具合
  - エラー
  - 動かな
  - 動きませ
  - おかしい
  - 壊れ
  priority: 1
  answer: |-
    おお、それは有難い。粗を教えてくださるのが一番の助けでござる。

    **急ぐなら**
    まず画面を強めに読み直してみられよ（キャッシュが古いことがままござる）。

    **それでも直らぬなら**
    {source} の Issues へ、**何をしたら何が起きたか**を添えて知らせてくだされ。
    使うた端末と browser の名も添えてもらえると、探す手間が半分になり申す。

    「いつ・どの画面で・何をしたら・どうなったか」の四つが揃うと、直りが早うござる。
- name: admin_login
  examples:
  - 管理画面はどこですか
  - ログインできません
  - 管理者としてログインしたい
  - admin ページは
  must:
  - 管理画面
  - ログイン
  - admin
  - 管理者
  priority: 1
  answer: |-
    管理の画面は、表には出しておらぬ。

    在り処も伏せてあり、鍵も二重にかけてござる。
    **見本の場とは申せ、客の名や連絡先を預かる場所ゆえ**、そこだけは本気で守っておる。

    御身が客として予約を見たいのであれば、控えのメールに手がかりがござる。
    御身が院を営む側で、管理の画面を見てみたいのであれば——それは相談の筋でござるな:
    {source} の Issues に一筆書き置かれよ。
- name: ec_payment
  examples:
  - 本当にお金がかかりますか
  - 決済は動くの
  - 課金されませんか
  - クレジットカードを入れて大丈夫
  - 支払いはどうなる
  must:
  - 決済
  - 支払
  - 課金
  - クレジット
  - カード
  - お金がかか
  - 請求
  priority: 2
  answer: |-
    案ずるな。**まことの金子は一切動かぬ。**

    支払いの仕組みは繋いであるが、**試し用の口**しか通しておらぬ。
    番号を入れても請求は立たず、品も届か申さぬ。心置きなく最後まで通してみられよ。

    試すなら `4242 4242 4242 4242` という札を使うのが習わしでござる
    （試し用にと世に配られておる番号ゆえ、御身の財布とは何の関わりも無い）。

    ⚠ まことの札の数字は入れられるな。ここは見本ゆえ、その必要が無い。
    {public}/ec/ でどうぞ。
- name: ec_order
  examples:
  - 注文の確認はどこ
  - 注文履歴を見たい
  - 発送はいつ
  - 配送状況
  - 注文したものはどうなる
  must:
  - 注文
  - 発送
  - 配送
  - 履歴
  priority: 1
  answer: |-
    注文の行方は、{public}/ec/ で辿れ申す。

    **会員として買われたなら** 帳面（マイページ）に控えが並ぶ。
    **名を告げずに買われたなら** 注文の折に出る**照会の合言葉**で辿れる。
    控えのメールにも同じものが載っており申す。

    見本ゆえ品は届かぬが、注文が受け付けられ、状の移り変わるところまでは本物同様に動く。
- name: demo_go
  examples:
  - go のデモは
  - go 言語のページ
  - golang のやつ
  must:
  - go言語
  - golang
  - goのデモ
  - goのページ
  answer: |-
    {public}/go/ にござる。

    Go で書いた小さな一枚もので、その場の版と、目覚めてからの時を映すだけの代物。
    飾り気は無いが、**この server の上で Go が確かに動いておる証**でござる。

    Python の方も隣に置いてある: {public}/py/
- name: demo_py
  examples:
  - python のデモは
  - python のページ
  - パイソンのやつ
  - fastapi のデモ
  must:
  - python
  - パイソン
  - fastapi
  answer: |-
    {public}/py/ にござる。

    Python（FastAPI）で書いた小さな一枚もの。版と、目覚めてからの時を映す。
    {public}/py/docs を覗けば、api の品書きが自ずと組み上がっておるのが見え申す。

    Go の方も隣に置いてある: {public}/go/

    ……なお、拙者の頭も同じ Python でできており申す。
- name: language
  examples:
  - 英語は話せますか
  - do you speak english
  - 外国語に対応してる
  - 中国語でも大丈夫
  - 多言語対応してますか
  must:
  - 英語
  - english
  - 外国語
  - 中国語
  - 韓国語
  - 多言語
