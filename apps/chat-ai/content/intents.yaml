  answer: |-
    ここは **4510 lab**、拙者の主が腕を試すための実験場でござる。

    一つのサーバーに、性格の違う作品を集めてある:

    - **EC サイト**（Java / Spring Boot）— 商品・カート・注文・決済まで
    - **予約システム**（PHP / SQLite）— 整体院向けのWeb予約
    - **ゲーム2本**（ポーカー / ソリティア）
    - **このチャット**（Go + Python の二段構え。意図を読んで即答する）

    どれも実際に触れるでござる。{public}/ が入口。
- name: lab_help
  examples:
  - 何ができる
  - できること
  - 使い方
  - ヘルプ
  - 何を聞けばいい
  - どんな質問ができる
  - メニュー
  priority: 1
  answer: |-
    拙者に聞けるのはこのあたりでござる。

    **この実験場のこと**
    「ここは何？」「技術構成は？」「無料なの？」「ソースコードは？」
    「**なぜ LLM を使っていないの？**」

    **天気**
    「東京の天気は？」「明日の大阪は？」「ロンドンの天気」
    … 国内は全都道府県、海外は主要都市に対応しておる

    **買い物・予約**
    「3000円以内で贈り物ある？」「猫のグッズは？」「予約したい」

    **調べ物**
    「〇〇とは？」「〇〇について教えて」
    … 百科事典（Wikipedia）を引いてまいる。拙者の推測ではなく、出典を添えて返す

    **猫と動物のこと**
    「猫は好き？」「動物について語って」

    **予約システムの導入（院を営む御方へ）**
    「うちの院でも使える？」「どんな機能があるの？」「仕事を頼める？」
    「**料金は？**」「**納期は？**」「**実績は？**」「他社と何が違うの？」

    **遊び方**
    「ポーカーのルールは？」「ソリティアの遊び方」

    **困ったとき**
    「本当にお金がかかる？」「動きません」「反応が遅い」「連絡先は？」
    「送料は？」「返品できる？」「予約をキャンセルしたい」

    **拙者のこと・世間話**
    「自己紹介して」「元気？」「趣味は？」「疲れた」「暇だ」「猫を飼いたい」
    「**何か面白い話をして**」… この場所で実際に起きたことを、順に語り申す

    初めての御方は「**何から見ればいい？**」と聞かれよ。順に案内仕る。

    これ以外は、頭の LLM が拙い知恵を絞って答え申す。
    入口は {public}/ でござる。
