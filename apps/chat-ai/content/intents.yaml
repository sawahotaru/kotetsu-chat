    - **ソリティア** … {public}/solitaire/ 　初級と中級は必ず解ける配りしか出さぬゆえ、詰んで終わらぬ
    - **ポーカー** … {public}/poker/ 　役が揃うまでの間が、なかなか良い

    賭けるものは何も無いゆえ、心置きなく負けられ申す。
- name: praise
