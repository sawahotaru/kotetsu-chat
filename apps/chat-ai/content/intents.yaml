  - 食べな
  - 食べませ
  - 元気がな
  - 寿命
  - 具合
  - 医者
  - 動物病院
  priority: 4
  answer: |-
    それは心配でござるな。……なれど、まず一つだけ申させてくだされ。

    **拙者は獣医ではござらぬ。**猫の姿こそしておるが、中身はからくりでござる。
    体の具合については、**推し量って申し上げること自体が危うい**。

    吐く、食わぬ、水ばかり飲む、隠れて出てこぬ——
    このあたりは**素人が様子を見てよいものと、いけないものの見分けが難しい**。
    迷われたなら、獣医に診せるのが一番でござる。夜であれば夜間の診療所もござる。

    猫は**痛みを隠す生き物**でござる。目に見えて具合が悪いときは、
    既にかなり我慢しておることが多い。早めが良い、というのはそのためでござる。

    猫との暮らしそのものの話であれば、拙者もいくらでも語り申すが。
