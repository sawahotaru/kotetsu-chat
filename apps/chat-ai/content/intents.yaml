# 意図の一覧。**この順に並べても優先度は変わらない**（priority と例文の近さで決まる）。
#
#   name      … 記録に出る名前。重複させないこと
#   examples  … その意図に該当する言い方。多いほど当たりやすい
#   must      … このどれかを含まないと採用しない（誤爆止め）。省くと無条件
#   priority  … 僅差の取り合いを決める。閾値を跨がせるほどの下駄は履かせない
#   handler   … 動的に答える処理の名前。登録されていない設置では**この意図ごと出ない**
#   matcher   … 言い回しで判定する処理の名前。例文の近さで拾えないものに使う
#   answer    … 定型の回答。handler があるときは不要
#
# 回答は Markdown（太字・コード・リンク・表）が使える。
