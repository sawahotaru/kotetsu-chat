    どれも画面の幅に合わせて形を変える作りにしてある。
    ポーカーの札は幅に応じて伸び縮みし、予約の画面も指で押しやすい大きさにしてござる。

    {public}/ を手元の端末で開いてみられよ。
- name: how_are_you
