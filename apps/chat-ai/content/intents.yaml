    clone して `docker compose up` すれば、御身の手元でも拙者が立ち申す
    （**人格は差し替えてくだされ**。こてつは一人でよい）。

    主の GitHub は {source} でござる。
- name: demo_ec
  examples:
  - ecサイトについて
  - 通販サイトは
  - ショップはどこ
