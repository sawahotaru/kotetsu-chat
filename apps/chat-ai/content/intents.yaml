  - ショップ
  - 通販
  - 店
  - 買い物
  answer: |-
    EC サイトは {public}/ec/ にござる。

    和の品を扱う店の体裁で、商品を見て、カートに入れ、注文まで通せる。
    会員登録せぬ「ゲスト購入」もでき、注文後は照会リンクで状況を追える。
    送料・クーポン・消費税（軽減税率含む）も本物同様に計算しておる。

    管理画面もあるが、**展示ゆえ書き込みは封じてある**。壊せぬ作りでござる。

    ……ちなみに、そこに拙者の具足も並んでおる。
- name: demo_clinic
  examples:
