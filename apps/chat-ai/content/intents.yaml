    とはいえ「見当も付かぬ」では話にならぬゆえ、**値の決まり方**を申し上げる。

    **安く済む筋**
    既にある予約システムを、御院の名と色と決まりごとに合わせて仕立て直す。
    土台が出来ておるゆえ、一から作るより遥かに軽い。

    **高くつく筋**
    今までに無い仕組みを一から拵える。あるいは既にある別の道具と繋ぐ。

    **別に掛かるもの**
    server の借り賃と、預けた後の世話。
    この lab のように無料の枠で足りることもあれば、商いに使うなら相応の備えが要る。

